aid: movel-ai
name: Movel AI
description: >-
  Movel AI is a Singapore-based robotics deployment software company, founded in
  2016, that makes it faster and cheaper to get autonomous mobile robots up and
  running in real-world environments. Its platform pairs deep learning, sensor
  fusion, and probabilistic planning so robots can perceive their surroundings
  and plan tasks on their own. Core products are the Movel Fleet Management
  System (FMS) for real-time monitoring and control of multi-robot fleets and
  Movel RNS (Robotic Navigation System) for precise single-robot navigation of
  complex spaces, applied across logistics, manufacturing, construction, and
  healthcare. The company is backed by Silicon Solution Ventures, 500 Global,
  AviTech, SGInnovate, Seeds Capital, and Enterprise Singapore. It was surfaced
  as a portfolio company of 500 Global and added to the API Evangelist network.
  As of this enrichment pass Movel AI publishes no public API, developer portal,
  SDK, or OpenAPI surface.
